<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital DNA - Sites Vitrines</title>
  <meta name="robots" content="noindex, follow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; padding: 40px 20px; max-width: 600px; }
    h1 { font-size: 42px; margin-bottom: 16px; font-weight: 800; }
    p { font-size: 18px; color: #94a3b8; margin-bottom: 24px; }
    .loader { border: 4px solid #334155; border-top: 4px solid #7c3aed; border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; margin: 0 auto 24px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .link { display: inline-block; background: #7c3aed; color: white; padding: 14px 28px; border-radius: 10px; text-decoration: none; font-weight: 600; margin-top: 20px; }
    .link:hover { background: #6d28d9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="loader"></div>
    <h1>Chargement du site...</h1>
    <p>Redirection vers votre site vitrine</p>
    <a id="redirectLink" class="link">Voir le site →</a>
  </div>
  <script>
    var path = window.location.pathname;
    var matches = path.match(/(\d+)(?:\/.*)?$/);
    if (matches && matches[1]) {
      var targetUrl = '/sitevitrine-sms-campaign/sms-campaign-' + matches[1] + '/';
      document.getElementById('redirectLink').href = targetUrl;
      setTimeout(function() { window.location.href = targetUrl; }, 1500);
    } else {
      document.querySelector('h1').textContent = 'Digital DNA';
      document.querySelector('p').textContent = 'Sites vitrines professionnels';
      document.getElementById('redirectLink').style.display = 'none';
      document.querySelector('.loader').style.display = 'none';
    }
  </script>
</body>
</html>
